<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #12141c;
    --card: #1b1f2b;
    --accent: #5eead4;
    --accent-dim: #2dd4bf33;
    --text: #f2f4f8;
    --muted: #8a90a3;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1e2233, var(--bg));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 24px;
    padding: 28px 24px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.25rem;
    text-align: center;
    margin: 0 0 4px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .source-link {
    display: block;
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-bottom: 4px;
    word-break: break-all;
  }
  .source-link a { color: var(--muted); }
  .counter-label {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .stage {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 0 auto 20px;
  }
  .stage-photo {
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    object-fit: cover;
    width: calc(100% - 20px);
    height: calc(100% - 20px);
    opacity: 0.35;
    filter: saturate(0.7);
  }
  .stage-photo[hidden] { display: none; }
  svg { position: relative; transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring-bg { fill: none; stroke: #2a2f40; stroke-width: 10; }
  .ring-fg {
    fill: none;
    stroke: var(--accent);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.25s linear, stroke 0.3s ease;
  }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 20px;
  }
  .time {
    font-size: 3rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .exercise-name {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 22px 0 4px;
    text-align: center;
    min-height: 1.6em;
  }
  .next-up {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
    min-height: 1.3em;
  }
  .next-up span { color: var(--accent); font-weight: 600; }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 14px 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #startBtn { background: var(--accent); color: #0b3b34; }
  #pauseBtn { background: #33394d; color: var(--text); }
  #resetBtn { background: #33394d; color: var(--danger); flex: 0.7; }
  .toggle-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 18px;
  }
  .toggle-row input { accent-color: var(--accent); width: 16px; height: 16px; }
  .wake-status {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    min-height: 1.2em;
    margin-bottom: 12px;
  }
  .wake-status.warn { color: #fbbf24; }
  .list {
    max-height: 260px;
    overflow-y: auto;
    border-top: 1px solid #2a2f40;
    padding-top: 12px;
  }
  .list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px;
    border-radius: 10px;
    color: var(--muted);
    font-size: 0.88rem;
  }
  .list-item .thumb {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: #2a2f40;
  }
  .list-item .num {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #2a2f40;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    flex-shrink: 0;
  }
  .list-item .duration {
    margin-left: auto;
    font-size: 0.75rem;
    opacity: 0.7;
    flex-shrink: 0;
  }
  .list-item.current {
    background: var(--accent-dim);
    color: var(--text);
    font-weight: 600;
  }
  .list-item.current .num { background: var(--accent); color: #0b3b34; }
  .list-item.done { text-decoration: line-through; opacity: 0.5; }
  .list-item.done .num::after { content: "✓"; }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: #33394d; border-radius: 3px; }
</style>
</head>
<body>
<div class="app">
  <h1>__TITLE__</h1>
  __SOURCE_LINK__
  <div class="counter-label" id="progressLabel">Exercise 1 of __COUNT__</div>

  <div class="stage">
    <img class="stage-photo" id="stagePhoto" alt="" hidden>
    <svg viewBox="0 0 100 100">
      <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
      <circle class="ring-fg" id="ringFg" cx="50" cy="50" r="45"></circle>
    </svg>
    <div class="ring-center">
      <div class="time" id="timeDisplay">0:00</div>
    </div>
  </div>

  <div class="exercise-name" id="exerciseName">Ready?</div>
  <div class="next-up" id="nextUp">Tap Start to begin</div>

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="pauseBtn" disabled>Pause</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="toggle-row">
    <input type="checkbox" id="voiceToggle" checked>
    <label for="voiceToggle">Voice announcements</label>
  </div>

  <div class="wake-status" id="wakeStatus"></div>

  <div class="list" id="list"></div>
</div>

<video id="wakeVideo" muted loop playsinline webkit-playsinline
  style="position:fixed; width:1px; height:1px; opacity:0.01; pointer-events:none; top:0; left:0;">
  <source src="__WAKE_VIDEO_MP4__" type="video/mp4">
  <source src="__WAKE_VIDEO_WEBM__" type="video/webm">
</video>

<script>
  // Generated by build_page.py -- do not hand-edit EXERCISES, edit workout.json instead.
  const EXERCISES = __EXERCISES_JSON__;
  const WARN_AT = 10;

  const timeDisplay = document.getElementById('timeDisplay');
  const exerciseNameEl = document.getElementById('exerciseName');
  const nextUpEl = document.getElementById('nextUp');
  const progressLabel = document.getElementById('progressLabel');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const voiceToggle = document.getElementById('voiceToggle');
  const listEl = document.getElementById('list');
  const ringFg = document.getElementById('ringFg');
  const stagePhoto = document.getElementById('stagePhoto');
  const wakeVideo = document.getElementById('wakeVideo');
  const wakeStatus = document.getElementById('wakeStatus');

  const CIRC = 2 * Math.PI * 45;
  ringFg.style.strokeDasharray = CIRC;

  let index = -1;
  let remaining = EXERCISES[0] ? EXERCISES[0].duration : 60;
  let timerId = null;
  let running = false;
  let warnedThisExercise = false;
  let wakeLock = null;
  let nativeWakeLockOK = false;
  let videoWakeLockOK = false;

  function updateWakeStatus() {
    if (!running) { wakeStatus.textContent = ''; wakeStatus.classList.remove('warn'); return; }
    if (nativeWakeLockOK || videoWakeLockOK) {
      wakeStatus.textContent = 'Keeping screen awake';
      wakeStatus.classList.remove('warn');
    } else {
      wakeStatus.textContent = 'Could not keep screen awake — adjust your phone’s auto-lock/sleep setting for this workout';
      wakeStatus.classList.add('warn');
    }
  }

  let wakeRefreshTimer = null;

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        if (wakeLock) { try { await wakeLock.release(); } catch (e) {} }
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; nativeWakeLockOK = false; updateWakeStatus(); });
        nativeWakeLockOK = true;
      }
    } catch (e) {
      nativeWakeLockOK = false;
    }
    try {
      if (wakeVideo.paused) await wakeVideo.play();
      videoWakeLockOK = true;
    } catch (e) {
      videoWakeLockOK = false;
    }
    updateWakeStatus();
    // Some mobile browsers silently drop the wake lock (or stall the
    // fallback video) without firing any event we can listen for, so
    // re-assert both every 20s as a safety net rather than trusting
    // either to hold for the whole workout.
    if (!wakeRefreshTimer) {
      wakeRefreshTimer = setInterval(() => { if (running) requestWakeLock(); }, 20000);
    }
  }

  function releaseWakeLock() {
    if (wakeRefreshTimer) {
      clearInterval(wakeRefreshTimer);
      wakeRefreshTimer = null;
    }
    if (wakeLock) {
      wakeLock.release();
      wakeLock = null;
    }
    wakeVideo.pause();
    wakeVideo.currentTime = 0;
    nativeWakeLockOK = false;
    videoWakeLockOK = false;
    updateWakeStatus();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) requestWakeLock();
  });

  function renderList() {
    listEl.innerHTML = '';
    EXERCISES.forEach((ex, i) => {
      const row = document.createElement('div');
      row.className = 'list-item' + (i === index ? ' current' : '') + (i < index ? ' done' : '');
      const thumb = ex.image
        ? `<img class="thumb" src="${ex.image}" alt="">`
        : `<span class="num">${i < index ? '' : i + 1}</span>`;
      row.innerHTML = `${thumb}<span>${ex.name}</span><span class="duration">${ex.duration}s</span>`;
      listEl.appendChild(row);
    });
    const current = listEl.querySelector('.current');
    if (current) current.scrollIntoView({ block: 'nearest' });
  }

  function updateRing(duration) {
    const frac = remaining / duration;
    ringFg.style.strokeDashoffset = CIRC * (1 - frac);
    ringFg.style.stroke = remaining <= WARN_AT ? '#fbbf24' : 'var(--accent)';
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${sec.toString().padStart(2, '0')}`;
  }

  function speak(text) {
    if (!voiceToggle.checked || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.0;
    utter.pitch = 1.0;
    window.speechSynthesis.speak(utter);
  }

  function beep(freq = 880, duration = 150) {
    try {
      const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
      osc.start();
      osc.stop(ctx.currentTime + duration / 1000);
    } catch (e) { /* audio unavailable */ }
  }

  function updateDisplay() {
    const current = EXERCISES[index];
    timeDisplay.textContent = formatTime(remaining);
    updateRing(current.duration);
    exerciseNameEl.textContent = current.name;
    progressLabel.textContent = `Exercise ${index + 1} of ${EXERCISES.length}`;
    const next = EXERCISES[index + 1];
    nextUpEl.innerHTML = next ? `Next: <span>${next.name}</span>` : 'Last exercise — finish strong!';
    if (current.image) {
      stagePhoto.src = current.image;
      stagePhoto.hidden = false;
    } else {
      stagePhoto.hidden = true;
    }
    renderList();
  }

  function startExercise(i, announce) {
    index = i;
    remaining = EXERCISES[index].duration;
    warnedThisExercise = false;
    updateDisplay();
    beep(880, 180);
    if (announce) speak(EXERCISES[index].name);
  }

  function tick() {
    const current = EXERCISES[index];
    remaining--;
    if (remaining === WARN_AT && !warnedThisExercise && current.duration > WARN_AT) {
      warnedThisExercise = true;
      const next = EXERCISES[index + 1];
      if (next) speak(`10 seconds. Next up: ${next.name}`);
      else speak('10 seconds left. Almost done!');
    }
    if (remaining <= 0) {
      if (index + 1 < EXERCISES.length) {
        startExercise(index + 1, true);
      } else {
        finishWorkout();
        return;
      }
    }
    updateDisplay();
  }

  function finishWorkout() {
    stopTimer();
    releaseWakeLock();
    exerciseNameEl.textContent = 'Workout complete! 🎉';
    nextUpEl.textContent = 'Great job!';
    timeDisplay.textContent = '0:00';
    beep(1046, 300);
    speak('Workout complete. Great job!');
    startBtn.disabled = true;
    pauseBtn.disabled = true;
  }

  function stopTimer() {
    running = false;
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  startBtn.addEventListener('click', () => {
    if (running) return;
    running = true;
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    pauseBtn.textContent = 'Pause';
    requestWakeLock();
    if (index === -1) {
      startExercise(0, true);
    }
    timerId = setInterval(tick, 1000);
  });

  pauseBtn.addEventListener('click', () => {
    if (running) {
      stopTimer();
      releaseWakeLock();
      pauseBtn.textContent = 'Resume';
      startBtn.disabled = false;
      startBtn.textContent = 'Resume';
      window.speechSynthesis.cancel();
    } else {
      running = true;
      startBtn.disabled = true;
      pauseBtn.textContent = 'Pause';
      requestWakeLock();
      timerId = setInterval(tick, 1000);
    }
  });

  function resetToStart() {
    stopTimer();
    releaseWakeLock();
    window.speechSynthesis.cancel();
    index = -1;
    remaining = EXERCISES[0].duration;
    startBtn.disabled = false;
    startBtn.textContent = 'Start';
    pauseBtn.disabled = true;
    pauseBtn.textContent = 'Pause';
    exerciseNameEl.textContent = 'Ready?';
    nextUpEl.textContent = 'Tap Start to begin';
    timeDisplay.textContent = formatTime(remaining);
    progressLabel.textContent = `Exercise 1 of ${EXERCISES.length}`;
    stagePhoto.hidden = true;
    ringFg.style.strokeDashoffset = 0;
    renderList();
  }

  resetBtn.addEventListener('click', resetToStart);

  resetToStart();
</script>
</body>
</html>
