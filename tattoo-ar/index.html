<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!--APP-START-->
<title>Tattoo Try-On</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Pinyon+Script&family=UnifrakturMaguntia&family=Special+Elite&display=swap">
<style>
/* Layout: full-bleed camera stage with a bottom control sheet, like a viewfinder over a flash sheet. */
:root {
  --ink: #111013;          /* page ground, tattoo-ink black */
  --sheet: #1b191f;        /* control sheet */
  --raise: #26232c;        /* raised controls */
  --line: #34303b;         /* hairlines */
  --fg: #f2eef4;           /* text */
  --muted: #a49cab;        /* secondary text */
  --stencil: #8b6dff;      /* transfer-stencil violet, the accent */
  --stencil-soft: rgba(139,109,255,.18);
  --danger: #ff8a7a;
  --font-display: "Pirata One", "UnifrakturMaguntia", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--font-body); font-size: 14px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--stencil); outline-offset: 2px; }

.app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #000; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
#cv:active { cursor: grabbing; }
video { display: none; }

.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(rgba(10,9,12,.75), rgba(10,9,12,0));
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.mark { font-family: var(--font-display); font-size: 26px; line-height: 1; letter-spacing: .01em; white-space: nowrap; }
.mark span { color: var(--stencil); }
.seg { display: flex; background: rgba(27,25,31,.82); border: 1px solid var(--line); border-radius: 999px; padding: 3px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--ink); }

.status {
  position: absolute; left: 50%; transform: translateX(-50%); z-index: 2;
  top: calc(env(safe-area-inset-top, 0px) + 60px);
  max-width: min(92%, 420px); text-align: center;
  background: rgba(27,25,31,.9); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 12px; font-size: 13px; line-height: 1.4; color: var(--fg);
}
.status.warn { border-color: var(--danger); }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 76px; z-index: 2; font-size: 12px; color: var(--muted); background: rgba(17,16,19,.7); padding: 6px 10px; border-radius: 999px; white-space: nowrap; pointer-events: none; transition: opacity .4s; }

.fab { position: absolute; z-index: 2; bottom: 12px; display: flex; gap: 10px; right: max(16px, env(safe-area-inset-right, 0px)); }
.fab button { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: rgba(27,25,31,.88); display: grid; place-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.fab button.shoot { background: var(--fg); color: var(--ink); border: 0; }
.fab button[aria-pressed="true"] { background: var(--stencil); border-color: var(--stencil); color: #fff; }
.fab svg { width: 22px; height: 22px; }
.fab-left { left: max(16px, env(safe-area-inset-left, 0px)); right: auto; }

.sheet {
  background: var(--sheet); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 12px);
  display: flex; flex-direction: column; gap: 10px;
}
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 8px 4px 10px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--stencil); }
.pane { min-height: 132px; }
[hidden] { display: none !important; }

.flash { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.flash button { aspect-ratio: 1; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #ebe6e1; padding: 6px; display: grid; place-items: center; position: relative; overflow: hidden; }
.flash button img { width: 100%; height: 100%; object-fit: contain; }
.flash button[aria-pressed="true"] { outline: 2px solid var(--stencil); outline-offset: 2px; }
.flash .upload { background: var(--raise); color: var(--fg); font-size: 11px; font-weight: 600; gap: 2px; align-content: center; text-align: center; }
.flash .upload svg { width: 22px; height: 22px; margin: 0 auto; }
.textrow { display: flex; gap: 8px; margin-top: 10px; }
.textrow input, .textrow select { background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-width: 0; }
.textrow input { flex: 1; }
.textrow button { background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-weight: 600; white-space: nowrap; }

.sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
.slider { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.slider label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.slider output { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg); text-transform: none; letter-spacing: 0; }
input[type="range"] { width: 100%; accent-color: var(--stencil); margin: 0; height: 24px; }
.btnrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btnrow button, .chips button { background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 13px; }
.btnrow button[aria-pressed="true"], .chips button[aria-pressed="true"] { background: var(--stencil-soft); border-color: var(--stencil); color: var(--fg); }

.chips { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.chips button { border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.chips small { font-weight: 400; color: var(--muted); font-size: 11px; }
.toggle { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; }
.toggle input { accent-color: var(--stencil); width: 18px; height: 18px; }

.result { position: fixed; inset: 0; z-index: 10; background: rgba(8,7,10,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-top: calc(env(safe-area-inset-top, 0px) + 16px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.result img { max-width: 100%; max-height: 70%; border-radius: 12px; border: 1px solid var(--line); -webkit-touch-callout: default; }
.result p { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
.result .btnrow { justify-content: center; margin: 0; }
.result .primary { background: var(--fg); color: var(--ink); border-color: var(--fg); }

@media (min-width: 900px) {
  .app { flex-direction: row; }
  .sheet { width: 360px; border-top: 0; border-left: 1px solid var(--line); overflow-y: auto; padding-block: 16px; }
  .flash { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .sliders { grid-template-columns: 1fr; }
}
@media (max-height: 640px) and (max-width: 899px) { .pane { min-height: 0; } .flash { grid-template-columns: repeat(6, minmax(0,1fr)); } }
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Preview of the tattoo on your skin. Drag to move, pinch to resize and rotate."></canvas>
    <video id="video" playsinline muted autoplay></video>

    <div class="topbar">
      <div class="mark">Tattoo <span>Try-On</span></div>
      <div class="seg" role="group" aria-label="Background">
        <button id="srcLive" aria-pressed="false">Live</button>
        <button id="srcPhoto" aria-pressed="false">Photo</button>
      </div>
    </div>
    <div class="status" id="status" hidden></div>
    <div class="hint" id="hint">Drag to move · pinch to size &amp; rotate</div>

    <div class="fab fab-left">
      <button id="flipCam" title="Switch camera" aria-label="Switch camera" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3l2-3h8l2 3h3v12H3z"/><path d="M9 13a3 3 0 0 1 5-2.2M15 13a3 3 0 0 1-5 2.2"/><path d="M14 9v2h-2M10 17v-2h2"/></svg>
      </button>
      <button id="freeze" title="Freeze frame" aria-label="Freeze frame" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
    </div>
    <div class="fab">
      <button class="shoot" id="shoot" title="Save picture" aria-label="Save picture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
    </div>
  </div>

  <div class="sheet">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-design" aria-selected="true" aria-controls="pane-design">Design</button>
      <button role="tab" id="tab-fit" aria-selected="false" aria-controls="pane-fit">Fit</button>
      <button role="tab" id="tab-ink" aria-selected="false" aria-controls="pane-ink">Ink</button>
    </div>

    <div class="pane" id="pane-design" role="tabpanel">
      <div class="flash" id="flash">
        <button class="upload" id="uploadBtn" aria-label="Upload your own design">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
          Upload
        </button>
      </div>
      <div class="textrow">
        <input id="scriptText" type="text" maxlength="40" value="Amor fati" aria-label="Lettering">
        <select id="scriptFont" aria-label="Lettering style">
          <option value="Pinyon Script">Script</option>
          <option value="UnifrakturMaguntia">Blackletter</option>
          <option value="Special Elite">Typewriter</option>
        </select>
        <button id="scriptGo">Letter it</button>
      </div>
    </div>

    <div class="pane" id="pane-fit" role="tabpanel" hidden>
      <div class="sliders">
        <div class="slider"><label for="sSize">Size <output id="oSize"></output></label><input id="sSize" type="range" min="5" max="120" step="1"></div>
        <div class="slider"><label for="sRot">Rotate <output id="oRot"></output></label><input id="sRot" type="range" min="-180" max="180" step="1"></div>
        <div class="slider"><label for="sWrap">Wrap around limb <output id="oWrap"></output></label><input id="sWrap" type="range" min="0" max="100" step="1"></div>
        <div class="slider"><label for="sOpacity">Ink strength <output id="oOpacity"></output></label><input id="sOpacity" type="range" min="10" max="100" step="1"></div>
      </div>
      <div class="btnrow">
        <button id="mirror" aria-pressed="false">Mirror design</button>
        <button id="center">Re-center</button>
      </div>
    </div>

    <div class="pane" id="pane-ink" role="tabpanel" hidden>
      <div class="chips" id="inkChips">
        <button data-ink="stencil">Stencil<small>transfer</small></button>
        <button data-ink="fresh">Fresh<small>black</small></button>
        <button data-ink="healed">Healed<small>~5 yrs</small></button>
        <button data-ink="color">Color<small>as drawn</small></button>
      </div>
      <label class="toggle"><input type="checkbox" id="removeBg" checked> Remove white background from uploads</label>
      <div class="slider" style="margin-top:10px"><label for="sThr">Background cut-off <output id="oThr"></output></label><input id="sThr" type="range" min="50" max="99" step="1"></div>
    </div>
  </div>
</div>

<input type="file" id="designFile" accept="image/*" hidden>
<input type="file" id="photoFile" accept="image/*" hidden>

<div class="result" id="result" hidden>
  <img id="resultImg" alt="Your tattoo preview">
  <p id="resultNote">Press and hold the picture to save it.</p>
  <div class="btnrow">
    <button class="primary" id="saveBtn">Save</button>
    <button id="shareBtn" hidden>Share</button>
    <button id="closeResult">Back</button>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const video = $("video");
  const stageEl = $("stage");

  const state = {
    src: "demo",          // demo | live | photo
    facing: "user",
    stream: null,
    frozen: null,         // canvas holding a frozen video frame
    photo: null,          // uploaded background image
    raw: null,            // design as drawn (canvas)
    processed: null,      // design after ink processing (canvas)
    designId: null,
    x: 0.5, y: 0.48,      // centre, as fraction of stage
    scale: 0.42,          // design width as fraction of the stage's short side
    rot: -0.08,           // radians
    wrap: 0.45,           // 0..1 cylinder wrap
    opacity: 0.88,
    mirror: false,
    ink: "fresh",
    removeBg: true,
    thr: 0.86,
  };

  // ---------- Sizing ----------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = stageEl.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width * DPR));
    H = Math.max(1, Math.round(r.height * DPR));
    cv.width = W; cv.height = H;
    wrapCache.key = "";
  }
  new ResizeObserver(resize).observe(stageEl);

  // ---------- Status ----------
  let statusTimer = 0;
  function say(msg, warn = false, ms = 4200) {
    const s = $("status");
    s.textContent = msg; s.classList.toggle("warn", warn); s.hidden = false;
    clearTimeout(statusTimer);
    if (ms) statusTimer = setTimeout(() => { s.hidden = true; }, ms);
  }

  // ---------- Demo skin ----------
  // A shaded forearm so the first frame shows a tattoo on something skin-like.
  const demo = document.createElement("canvas");
  function buildDemo() {
    const w = 900, h = 1400; demo.width = w; demo.height = h;
    const c = demo.getContext("2d");
    const bg = c.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, "#2a2530"); bg.addColorStop(1, "#141217");
    c.fillStyle = bg; c.fillRect(0, 0, w, h);
    c.save();
    c.translate(w / 2, h / 2); c.rotate(-0.12);
    const aw = 520, ah = 1700;
    const g = c.createLinearGradient(-aw / 2, 0, aw / 2, 0);
    g.addColorStop(0, "#7a4b35"); g.addColorStop(0.18, "#b77b5c"); g.addColorStop(0.5, "#d9a07f");
    g.addColorStop(0.78, "#c48867"); g.addColorStop(1, "#6e412d");
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(-aw / 2 + 40, -ah / 2); c.bezierCurveTo(-aw / 2 - 30, -100, -aw / 2 + 10, 300, -aw / 2 + 70, ah / 2);
    c.lineTo(aw / 2 - 70, ah / 2); c.bezierCurveTo(aw / 2 - 10, 300, aw / 2 + 30, -100, aw / 2 - 40, -ah / 2);
    c.closePath(); c.fill();
    c.restore();
    // pore/skin noise
    const id = c.getImageData(0, 0, w, h), d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * 14;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    c.putImageData(id, 0, 0);
  }
  buildDemo();

  // ---------- Flash designs (procedural line art, black on transparent) ----------
  const S = 1024;
  function sheet() { const c = document.createElement("canvas"); c.width = S; c.height = S; const x = c.getContext("2d"); x.strokeStyle = x.fillStyle = "#000"; x.lineCap = "round"; x.lineJoin = "round"; return [c, x]; }

  function drawMandala() {
    const [c, x] = sheet(); x.translate(S / 2, S / 2);
    x.lineWidth = 9;
    [70, 150, 330, 470].forEach(r => { x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.stroke(); });
    x.beginPath(); x.arc(0, 0, 36, 0, Math.PI * 2); x.fill();
    const petal = (n, r0, r1, wd) => { for (let i = 0; i < n; i++) { x.save(); x.rotate(i * Math.PI * 2 / n); x.beginPath(); x.moveTo(0, -r0); x.quadraticCurveTo(wd, -(r0 + r1) / 2, 0, -r1); x.quadraticCurveTo(-wd, -(r0 + r1) / 2, 0, -r0); x.stroke(); x.restore(); } };
    petal(8, 70, 150, 40); petal(16, 150, 330, 52); petal(16, 330, 470, 40);
    x.lineWidth = 5; petal(16, 170, 290, 20);
    for (let i = 0; i < 32; i++) { x.save(); x.rotate(i * Math.PI / 16 + Math.PI / 32); x.beginPath(); x.arc(0, -400, 9, 0, Math.PI * 2); x.fill(); x.restore(); }
    for (let i = 0; i < 48; i++) { x.save(); x.rotate(i * Math.PI / 24); x.beginPath(); x.arc(0, -495, 6, 0, Math.PI * 2); x.fill(); x.restore(); }
    return c;
  }
  function drawPeaks() {
    const [c, x] = sheet(); x.translate(S / 2, S / 2);
    const R = 420; x.lineWidth = 12;
    x.beginPath(); x.arc(0, 0, R, 0, Math.PI * 2); x.stroke();
    x.save(); x.beginPath(); x.arc(0, 0, R - 6, 0, Math.PI * 2); x.clip();
    x.lineWidth = 8;
    x.beginPath(); x.arc(110, -150, 70, 0, Math.PI * 2); x.stroke();
    for (let i = 0; i < 4; i++) { x.beginPath(); x.moveTo(-R, -40 + i * 26 - 230); x.lineTo(-20 - i * 30, -40 + i * 26 - 230); x.stroke(); }
    const ridge = [[-R, 180], [-250, 20], [-170, 80], [-40, -130], [70, 30], [150, -40], [R, 160]];
    x.lineWidth = 11; x.beginPath(); ridge.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.stroke();
    x.lineWidth = 6;
    for (let k = 1; k < ridge.length - 1; k++) { const [a, b] = ridge[k]; for (let j = 1; j <= 6; j++) { x.beginPath(); x.moveTo(a, b + j * 4); x.lineTo(a + 10 - j * 30, b + 40 + j * 34); x.stroke(); } }
    x.lineWidth = 7;
    for (let i = 0; i < 7; i++) { const y = 230 + i * 32; x.beginPath(); for (let t = -R; t <= R; t += 8) { const yy = y + Math.sin(t / 38 + i) * 7; t === -R ? x.moveTo(t, yy) : x.lineTo(t, yy); } x.stroke(); }
    x.restore();
    return c;
  }
  function star(x, cx, cy, r, n = 5, inner = 0.42) { x.beginPath(); for (let i = 0; i < n * 2; i++) { const rr = i % 2 ? r * inner : r; const a = -Math.PI / 2 + i * Math.PI / n; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } x.closePath(); }
  function drawMoon() {
    const [c, x] = sheet(); x.translate(S / 2, S / 2);
    x.beginPath(); x.arc(-40, 0, 330, 0, Math.PI * 2); x.arc(70, -60, 290, 0, Math.PI * 2, true); x.fill("evenodd");
    x.globalCompositeOperation = "destination-out";
    x.beginPath(); x.arc(70, -60, 290, 0, Math.PI * 2); x.fill();
    x.globalCompositeOperation = "source-over";
    x.lineWidth = 6; x.setLineDash([2, 22]);
    x.beginPath(); x.arc(-40, 0, 420, -1.2, 2.6); x.stroke(); x.setLineDash([]);
    star(x, 230, 120, 70); x.fill();
    star(x, 140, -260, 38); x.fill();
    star(x, 330, -60, 26, 4, .3); x.fill();
    star(x, 260, 320, 30, 4, .3); x.fill();
    x.lineWidth = 8; star(x, -320, -330, 44); x.stroke();
    return c;
  }
  function drawCompass() {
    const [c, x] = sheet(); x.translate(S / 2, S / 2 + 30);
    x.lineWidth = 9; x.beginPath(); x.arc(0, 0, 300, 0, Math.PI * 2); x.stroke();
    x.lineWidth = 4; x.beginPath(); x.arc(0, 0, 278, 0, Math.PI * 2); x.stroke();
    for (let i = 0; i < 72; i++) { x.save(); x.rotate(i * Math.PI / 36); x.lineWidth = i % 9 === 0 ? 7 : 4; x.beginPath(); x.moveTo(0, -278); x.lineTo(0, i % 9 === 0 ? -250 : -262); x.stroke(); x.restore(); }
    const pt = (len, wd, half) => { x.beginPath(); x.moveTo(0, -len); x.lineTo(half === "l" ? -wd : wd, -wd * 0.9); x.lineTo(0, 0); x.closePath(); };
    for (let i = 0; i < 8; i++) {
      const len = i % 2 ? 230 : 420, wd = i % 2 ? 40 : 62;
      x.save(); x.rotate(i * Math.PI / 4);
      pt(len, wd, "l"); x.fill();
      x.lineWidth = 6; pt(len, wd, "r"); x.stroke();
      x.restore();
    }
    x.fillStyle = "#fff"; x.beginPath(); x.arc(0, 0, 26, 0, Math.PI * 2); x.fill();

  // ---------- Ink processing ----------
  function toCanvas(img, max = 1400) {
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;

    for (let x = 0; x < w; x++) { let s = 0; for (let y = -r; y <= r; y++) s += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = s / (2 * r + 1); s += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; } }

  function processDesign() {
    const src = state.raw; if (!src) { state.processed = null; return; }

    const A = new Float32Array(n);      // coverage 0..1

      else { A[i] = a * Math.min(1, 0.15 + dark * 1.1); }

      const m = new Uint8Array(n); for (let i = 0; i < n; i++) m[i] = A[i] > 0.4 ? 1 : 0;
      const rad = Math.max(2, Math.round(w / 300));
      const er = blurAlpha(Float32Array.from(m), w, h, rad);
      alpha = new Float32Array(n);
      for (let i = 0; i < n; i++) alpha[i] = m[i] && er[i] < 0.995 ? 1 : 0;
      alpha = blurAlpha(alpha, w, h, 1);

    let x0 = w, y0 = h, x1 = -1, y1 = -1;

    if (x1 < 0) { state.processed = null; say("That image looks empty after removing the background. Lower the background cut-off in Ink.", true); return; }
    const pad = 4; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);

  // ---------- Wrap (cylinder projection), cached ----------
  const wrapCache = { key: "", canvas: document.createElement("canvas") };

    try { await navigator.share({ files: [new File([lastBlob], "tattoo-preview.jpg", { type: "image/jpeg" })], title: "Tattoo preview" }); } catch (e) {}
  };

  // ---------- Boot ----------
  try { const ink = localStorage.getItem("tattoo-ink"); if (ink && ["stencil", "fresh", "healed", "color"].includes(ink)) state.ink = ink; } catch (e) {}
  resize();
  setDesign(FLASH[0].canvas, FLASH[0].id);
  syncControls();
  say("Demo arm shown. Tap Live for your camera, or Photo to use a picture of your skin.", false, 6000);
  requestAnimationFrame(frame);
})();
</script>
